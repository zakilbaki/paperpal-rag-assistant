name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install pytest fastapi httpx pydantic-settings pymongo certifi
          python-multipart PyMuPDF yake numpy scikit-learn pdfminer.six psutil
      - name: Check source syntax
        run: python -m compileall -q backend/app frontend
      - name: Run unit tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests
